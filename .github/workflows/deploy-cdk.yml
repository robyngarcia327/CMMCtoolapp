name: Deploy MSP infrastructure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'lambda/**'
      - '.github/workflows/deploy-cdk.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    environment: prod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: npx cdk deploy --require-approval never --parameters ExistingRestApiId=${{ vars.EXISTING_REST_API_ID }} --parameters ExistingOrgIdResourceId=${{ vars.EXISTING_ORG_ID_RESOURCE_ID }} --parameters ExistingBillingResourceId=${{ vars.EXISTING_BILLING_RESOURCE_ID }} --parameters ExistingCognitoAuthorizerId=${{ vars.EXISTING_COGNITO_AUTHORIZER_ID }} --parameters OrgDirectoryTableName=${{ vars.ORG_DIRECTORY_TABLE_NAME }} --parameters TenantsTableName=${{ vars.TENANTS_TABLE_NAME }} --parameters StripeSecretArn=${{ vars.STRIPE_SECRET_ARN }} --parameters StripePythonLayerArn=${{ vars.STRIPE_PYTHON_LAYER_ARN }} --parameters StripeMspBasePriceId=${{ vars.STRIPE_MSP_BASE_PRICE_ID }} --parameters StripeMspClientPriceId=${{ vars.STRIPE_MSP_CLIENT_PRICE_ID }} --parameters StripeStarterPriceId=${{ vars.STRIPE_STARTER_PRICE_ID }} --parameters StripeProfessionalPriceId=${{ vars.STRIPE_PROFESSIONAL_PRICE_ID }} --parameters StripeGuidedPriceId=${{ vars.STRIPE_GUIDED_PRICE_ID }} --parameters InvitationFromEmail=${{ vars.INVITATION_FROM_EMAIL }}
